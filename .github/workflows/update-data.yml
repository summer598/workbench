name: 更新工作台数据

on:
  schedule:
    # 每6小时自动抓取一次（北京时间 0:00, 6:00, 12:00, 18:00）
    - cron: "0 */6 * * *"
  # 支持手动触发
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install requests urllib3

      - name: 抓取最新数据
        run: |
          python3 -c "
          import json, re, requests, urllib3
          urllib3.disable_warnings()

          s = requests.Session()
          s.headers.update({'User-Agent': 'Mozilla/5.0', 'Referer': 'https://finance.sina.com.cn'})
          s.verify = False

          def safe_float(v, d=0):
              try: return float(v)
              except: return d

          from datetime import datetime
          ts = datetime.now().strftime('%Y-%m-%d %H:%M:%S')

          # A股指数
          import os
          os.makedirs('data', exist_ok=True)
          try:
              r = s.get('https://hq.sinajs.cn/list=sh000001,sz399001,sz399006', timeout=10)
              r.encoding = 'gbk'
              indices = []
              names = {'sh000001':'上证指数','sz399001':'深证成指','sz399006':'创业板指'}
              for line in r.text.strip().split('\n'):
                  m = re.match(r'var hq_str_(\w+)=\"([^\"]+)\"', line)
                  if not m: continue
                  code, data = m.group(1), m.group(2).split(',')
                  if len(data) < 32: continue
                  cur = safe_float(data[3]); yes = safe_float(data[2])
                  pct = ((cur-yes)/yes*100) if yes else 0
                  indices.append({'name':names.get(code,data[0]),'code':code,'price':round(cur,2),'change':round(cur-yes,2),'change_pct':round(pct,2),'direction':'up' if pct>0 else ('down' if pct<0 else 'flat'),'time':data[31] if len(data)>31 else ''})
              json.dump({'status':'ok','data':indices,'_updated_at':ts}, open('data/stock.json','w',encoding='utf-8'), ensure_ascii=False, indent=2)
              print('stock.json OK')
          except Exception as e:
              print('stock error:', e)

          # 黄金
          try:
              r = s.get('https://hq.sinajs.cn/list=hf_GC,sh600916', timeout=10)
              r.encoding = 'gbk'
              gd = {}
              for line in r.text.strip().split('\n'):
                  m = re.match(r'var hq_str_(\w+)=\"([^\"]+)\"', line)
                  if not m: continue
                  code, ds = m.group(1), m.group(2)
                  if not ds: continue
                  data = ds.split(',')
                  if code == 'hf_GC':
                      cur = safe_float(data[0]); yes = safe_float(data[7]) if len(data)>7 else 0
                      pct = ((cur-yes)/yes*100) if yes else 0
                      gd['comex_gold'] = {'name':'COMEX黄金期货','price':round(cur,2),'change':round(cur-yes,2),'change_pct':round(pct,2),'direction':'up' if pct>0 else ('down' if pct<0 else 'flat')}
                  elif code == 'sh600916':
                      cur = safe_float(data[3]); yes = safe_float(data[2])
                      pct = ((cur-yes)/yes*100) if yes else 0
                      gd['china_gold_stock'] = {'name':'中国黄金(600916)','price':round(cur,2),'change':round(cur-yes,2),'change_pct':round(pct,2),'direction':'up' if pct>0 else ('down' if pct<0 else 'flat')}
              json.dump({'status':'ok','data':gd,'_updated_at':ts}, open('data/gold.json','w',encoding='utf-8'), ensure_ascii=False, indent=2)
              print('gold.json OK')
          except Exception as e:
              print('gold error:', e)

          # 财经新闻
          try:
              s.headers['Referer'] = 'https://kuaixun.eastmoney.com/'
              r = s.get('https://newsapi.eastmoney.com/kuaixun/v1/getlist_102_ajaxResult_50_1_.html', timeout=10)
              s.headers['Referer'] = 'https://finance.sina.com.cn'
              r.encoding = 'utf-8'
              m = re.search(r'var ajaxResult=(\{.*\})', r.text, re.S)
              d = json.loads(m.group(1)) if m else {}
              items = d.get('LivesList', [])[:20]
              news = []
              for item in items:
                  title = item.get('title',''); digest = item.get('digest','').replace('【','').replace('】','')
                  impact = 'neutral'
                  for kw in ['利好','增长','超预期','反弹','上涨','流入','降准','降息']:
                      if kw in title or kw in digest: impact = 'positive'; break
                  for kw in ['利空','下降','不及预期','下跌','流出','风险','收紧','加息']:
                      if kw in title or kw in digest: impact = 'negative'; break
                  news.append({'title':title,'digest':digest[:100],'impact':impact,'time':item.get('showtime',''),'url':item.get('url','')})
              json.dump({'status':'ok','data':news,'_updated_at':ts}, open('data/news.json','w',encoding='utf-8'), ensure_ascii=False, indent=2)
              print('news.json OK')
          except Exception as e:
              print('news error:', e)

          # 热搜
          try:
              s.headers['Referer'] = 'https://www.toutiao.com/'
              r = s.get('https://www.toutiao.com/hot-event/hot-board/?origin=toutiao_pc', timeout=10)
              s.headers['Referer'] = 'https://finance.sina.com.cn'
              d = r.json()
              items = d.get('data',[])[:15]
              hot = [{'rank':i+1,'title':x.get('Title',''),'hot':x.get('HotValue',0),'url':x.get('Url',''),'label':x.get('Label','')} for i,x in enumerate(items)]
              json.dump({'status':'ok','data':hot,'_updated_at':ts}, open('data/hot.json','w',encoding='utf-8'), ensure_ascii=False, indent=2)
              print('hot.json OK')
          except Exception as e:
              print('hot error:', e)

          print('全部数据抓取完成')
          "

      - name: 提交并推送
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "🔄 自动更新数据 $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push
            echo "数据已更新并推送"
          fi
